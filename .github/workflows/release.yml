# Publishes the GitHub release that HACS offers as an update. It checks the version strings and the CHANGELOG
# entry, runs the tests, then creates the release (and its tag) with a zip for manual installs.
#
# Two ways to start it:
#  * Actions > Release > Run workflow (leave the box empty to release the version in manifest.json). This is the
#    usual way: Claude pushes the change to main, you press the button when you want it in Home Assistant.
#  * Pushing a tag v1.3.2 from a computer, or publishing a release by hand on GitHub (the zip is then added).
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 1.3.2 (empty = the version in manifest.json)"
        required: false
        default: ""
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements_test.txt
      - name: Which version
        id: v
        env:
          INPUT: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            v="${GITHUB_REF_NAME#v}"
          elif [ -n "$INPUT" ]; then
            v="${INPUT#v}"
          else
            v=$(python -c "import json; print(json.load(open('custom_components/irrigation_sequencer/manifest.json'))['version'])")
          fi
          echo "tag=v$v" >> "$GITHUB_OUTPUT"
          echo "Releasing **v$v** from \`${GITHUB_SHA::7}\`" >> "$GITHUB_STEP_SUMMARY"
      - name: Versions match and the CHANGELOG has an entry
        env:
          TAG: ${{ steps.v.outputs.tag }}
        run: python tools/release_check.py "$TAG" > notes.md
      - run: pip install -r requirements_test.txt
      - name: Tests
        run: pytest -q
      - name: Zip for manual installs (unzip into /config/custom_components/)
        run: cd custom_components && zip -r -X "$GITHUB_WORKSPACE/irrigation_sequencer.zip" irrigation_sequencer -x "*/__pycache__/*"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.v.outputs.tag }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" irrigation_sequencer.zip --clobber
          else
            gh release create "$TAG" irrigation_sequencer.zip --target "$GITHUB_SHA" --title "$TAG" --notes-file notes.md
          fi
          echo "Published: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$TAG" >> "$GITHUB_STEP_SUMMARY"
