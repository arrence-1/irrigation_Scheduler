run_cycle:
  fields:
    cycle:
      required: true
      example: 1
      selector:
        number:
          min: 1
          max: 12
          mode: box
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: irrigation_sequencer
stop:
  fields:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: irrigation_sequencer
skip_tap:
  fields:
    tap:
      required: true
      example: 2
      selector:
        number:
          min: 1
          max: 16
          mode: box
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: irrigation_sequencer
run_tap:
  fields:
    tap:
      required: true
      example: 1
      selector:
        number:
          min: 1
          max: 16
          mode: box
    minutes:
      required: false
      example: 5
      selector:
        number:
          min: 0.5
          max: 240
          step: 0.5
          unit_of_measurement: min
          mode: box
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: irrigation_sequencer
close_main_water:
  fields:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: irrigation_sequencer
open_main_water:
  fields:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: irrigation_sequencer
snooze_main_water_reminders:
  fields:
    hours:
      required: true
      example: 3
      selector:
        number:
          min: 0
          max: 168
          step: 0.5
          unit_of_measurement: h
          mode: box
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: irrigation_sequencer
skip_offline_tap:
  fields:
    tap:
      required: true
      example: 2
      selector:
        number:
          min: 1
          max: 16
          mode: box
    skip:
      required: false
      default: true
      selector:
        boolean:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: irrigation_sequencer
snooze_battery_warnings:
  fields:
    hours:
      required: true
      example: 24
      selector:
        number:
          min: 0
          max: 720
          step: 1
          unit_of_measurement: h
          mode: box
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: irrigation_sequencer
send_battery_report:
  fields:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: irrigation_sequencer
skip_next_cycle:
  fields:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: irrigation_sequencer
skip_watering:
  fields:
    hours:
      required: true
      example: 24
      selector:
        number:
          min: 0
          max: 168
          step: 1
          unit_of_measurement: h
          mode: box
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: irrigation_sequencer
