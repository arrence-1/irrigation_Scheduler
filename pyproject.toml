[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
# a Python deprecation warning raised from this integration's own code fails the tests (an early warning)
filterwarnings = ["error::DeprecationWarning:custom_components\\.irrigation_sequencer"]

[tool.ruff]
target-version = "py314"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]  # the classic default rules: real errors only
